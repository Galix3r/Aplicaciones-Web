<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos - ElectroFest</title>
    <!-- Bootstrap CSS (Para mantener la estructura y diseño responsivo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark text-white">

    <!-- Menú de navegación unificado -->
    <header class="mi-menu">
        <div class="contenedor">
            <a class="logo-marca" href="PaguinaPrincipal.html">
                <img src="../img/todas las imagenes/miami-logo-2.png" alt="Logo ElectroFest" height="40">
            </a>
            <nav>
                <ul class="lista-menu">
                    <li><a href="PaguinaPrincipal.html">Inicio</a></li>
                    <li><a href="Boletos.html">Boletos</a></li>
                    <li><a href="Galeria.html">Galería de Imagenes</a></li>
                    <li><a href="Tienda.html">Tienda</a></li>
                    <li><a href="Artistas.html">Artistas</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Sección de Galería con margen superior (style="margin-top: 100px;") para evitar que el menú la tape -->
    <main class="seccion-galeria" style="margin-top: 100px; margin-bottom: 50px;">
        <div class="contenedor">
            <h2 class="titulo-seccion text-center fw-bold mb-2">Galería de Mejores Escenarios</h2>
            <p class="texto-centro text-center text-muted mb-5">Estructuras monumentales y luces vibrantes que definen la experiencia electrónica.</p>

            <div class="galeria-grid">
                <div class="foto-item"><img src="../img/todas las imagenes/fondo africa.jpg" alt="Estructura monumental de escenario en festival al aire libre"></div>
                <div class="foto-item"><img src="../img/todas las imagenes/mejores fondos tomorroland.jpg" alt="Luces láser y pirotecnia iluminando el escenario principal"></div>
                <div class="foto-item"><img src="../img/todas las imagenes/1671761.jpg" alt="Vista panorámica de producción visual en concierto EDM"></div>
                <div class="foto-item"><img src="../img/todas las imagenes/FONDO-MARTIN-GARRIX.jpg" alt="Martin Garrix tocando en vivo ante miles de fanáticos"></div>
                <div class="foto-item"><img src="../img/todas las imagenes/baner.webp" alt="Escenario decorado con temática psicodélica y luces de colores"></div>
                <div class="foto-item"><img src="../img/todas las imagenes/tomorrowland.2.jpg" alt="Multitud disfrutando del espectáculo nocturno de música electrónica"></div>
                <div class="foto-item"><img src="../img/todas las imagenes/1671777.jpg" alt="Efectos especiales de fuego y humo en el escenario del festival"></div>
                <div class="foto-item"><img src="../img/todas las imagenes/2023.webp" alt="Escenario principal iluminado con pantallas LED gigantes"></div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="text-center py-4 bg-black text-muted">
        <p class="mb-0">&copy; 2026 ElectroFest. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
