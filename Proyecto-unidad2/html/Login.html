<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Martin Garrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Montserrat:wght@600;800&family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-login">
    <div class="inicio-secion">

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav class="mi-menu">
            <div class="contenedor">
                <a href="login.html" class="logo-marca">MARTIN GARRIX</a>
                <ul class="lista-menu">
                    <li><a href="login.html" class="activo">Acceso</a></li>
                    <li><a href="boletos.html">Comprar Boletos</a></li>
                    <li><a href="tienda.html">Tienda</a></li>
                </ul>
            </div>
        </nav>

        <main style="margin-top: 100px;">
            <!-- FORMULARIO DE INICIAR SESIÓN -->
            <div id="login-form" class="formulario">
                <h3 class="rock-salt-regular">Iniciar Sesión</h3>
                <form>
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="usuario@correo.com" required>

                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>

                    <button type="submit">Entrar</button>
                </form>
                <div class="enlaces-formulario">
                    <p>¿No tienes cuenta? <a href="#" onclick="showForm('register-form')">Regístrate aquí</a></p>
                </div>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <div id="register-form" class="formulario hidden">
                <h3 class="rock-salt-regular">Crear Cuenta</h3>
                <form>
                    <label for="reg-name">Nombre Completo</label>
                    <input type="text" id="reg-name" placeholder="Tu nombre" required>

                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="usuario@correo.com" required>

                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>

                    <button type="submit">Registrarse</button>
                </form>
                <div class="enlaces-formulario">
                    <p>¿Ya tienes cuenta? <a href="#" onclick="showForm('login-form')">Inicia sesión</a></p>
                </div>
            </div>
        </main>

        <footer class="pie-pagina">
            <div class="contenedor">
                <p>&copy; 2026 Martin Garrix Fansite. Todos los derechos reservados.</p>
            </div>
        </footer>

    </div>

    <script>
        function showForm(formId) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById(formId).classList.remove('hidden');
        }
    </script>
</body>
</html>
