<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ElectroFest</title>
    <!-- Enlace de Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-white">

    <main class="container my-5">
        <section class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card bg-secondary bg-opacity-25 p-4 border-light shadow">
                    <h2 class="text-center mb-4">Registro de Asistentes</h2>
                    
                    <!-- Formulario con varios tipos de entradas (input, select, textarea) -->
                    <form id="mi-formulario">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo:</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Escribe tu nombre">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo Electrónico:</label>
                            <input type="email" id="correo" class="form-control" placeholder="tucorreo@ejemplo.com">
                        </div>

                        <div class="mb-3">
                            <label for="tipo-zona" class="form-label">Zona del Festival:</label>
                            <select id="tipo-zona" class="form-select">
                                <option value="General">General</option>
                                <option value="VIP">VIP</option>
                                <option value="Backstage">Backstage</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="comentarios" class="form-label">Comentarios o Dudas:</label>
                            <textarea id="comentarios" class="form-control" rows="3" placeholder="Escribe algo opcional..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-light w-100 fw-bold">Enviar Registro</button>
                    </form>

                    <div id="resultado" class="mt-3 text-center fw-bold"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
