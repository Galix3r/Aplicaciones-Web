<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Usuario</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Montserrat:wght@600;800&family=Roboto&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="inicio-secion">
    <div class="superposicion">

        <header>
            <h1 class="rock-salt-regular">Bienvenido</h1>
        </header>

        <main>
            <div id="login-form" class="formulario">
                <h3 class="rock-salt-regular">Iniciar Sesión</h3>
                <form>
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="usuario@correo.com" required>

                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>

                    <button type="submit">Entrar</button>
                </form>

                <div class="enlaces-formulario">
                    <p>¿No tienes cuenta? <a href="#" onclick="showForm('register-form')">Regístrate aquí</a></p>
                </div>
            </div>

          
        </main>

        <footer>
            <p>&copy; Todos los derechos reservados.</p>
        </footer>

    </div>

    <script src="../js/archivo.js"></script>
</body>
</html>
